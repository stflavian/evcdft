name: EVC_DFT CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Julia 1.12 on Ubuntu
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Julia
      uses: julia-actions/setup-julia@v2
      with:
        version: '1.12'
        
    - name: Install FFTW package
      run: |
        julia --project=@. -e '
          using Pkg
          Pkg.add("FFTW")
        '
        
    - name: Run test suite
      run: |
        julia --project=@. -e '
          # Add src to LOAD_PATH
          push!(LOAD_PATH, "@.")
          push!(LOAD_PATH, joinpath(pwd(), "src"))
          
          # Include the main module
          include("src/evcdft.jl")
          
          # Import modules
          using .EVC_DFT
          using .EVC_DFT.Constants
          using .EVC_DFT.Types
          using .EVC_DFT.PlaneWave
          using .EVC_DFT.XCFunctionals
          using .EVC_DFT.SelfConsistent
          using Test
          
          println("Running comprehensive test suite...")
          
          # Run all test files
          include("test/unit_tests.jl")
          include("test/integration_tests.jl")
          include("test/test_phase1.jl")
          
          println("\n=== All CI tests completed successfully! ===")
        '
      env:
        JULIA_NUM_THREADS: auto
