name: EVC_DFT Test Suite

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests (Julia ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version:
          - '1.9'
          - '1.10'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Julia
      uses: julia-actions/setup-julia@v2
      with:
        version: ${{ matrix.version }}
        
    - name: Cache Julia artifacts
      uses: actions/cache@v3
      with:
        path: ~/.julia
        key: ${{ runner.os }}-julia-${{ matrix.version }}-${{ hashFiles('Project.toml', 'Manifest.toml') }}
        restore-keys: |
          ${{ runner.os }}-julia-${{ matrix.version }}-
          ${{ runner.os }}-julia-
    
    - name: Install dependencies
      run: |
        julia --project=@. -e '
          using Pkg
          Pkg.resolve()
          Pkg.instantiate()
        '
        
    - name: Run comprehensive test suite
      run: |
        julia --project=@. -e '
          # Add src to LOAD_PATH
          push!(LOAD_PATH, "@.")
          push!(LOAD_PATH, joinpath(pwd(), "src"))
          
          # Include and run tests
          include("test/unit_tests.jl")
          include("test/integration_tests.jl")
          include("test/test_phase1.jl")
          
          println("\n=== All tests completed successfully! ===")
        '
      env:
        JULIA_NUM_THREADS: auto
        
    - name: Run simple validation
      run: |
        julia --project=@. -e '
          include("src/evcdft.jl")
          using .EVC_DFT
          using .EVC_DFT.Constants
          using .EVC_DFT.Types
          using .EVC_DFT.XCFunctionals
          
          println("Testing basic functionality...")
          
          # Test constants
          @assert Constants.hbar == 1.0
          @assert Constants.m_e == 1.0
          @assert Constants.e == 1.0
          println("✓ Constants work")
          
          # Test types
          lattice = Types.SimpleCubic(5.0)
          @assert lattice.volume ≈ 125.0
          println("✓ Types work")
          
          # Test XC functionals
          density = 0.1
          @assert XCFunctionals.lda_exchange_energy(density) < 0.0
          @assert XCFunctionals.lda_correlation_energy(density) < 0.0
          println("✓ XC functionals work")
          
          # Test system creation
          system = EVC_DFT.create_uniform_electron_gas(5.0, 2, 10.0, (8, 8, 8))
          @assert system.electrons == 2
          println("✓ System creation works")
          
          println("\n✓ All validation tests passed!")
        '
